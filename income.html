<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Income — Textile Shop Manager</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div class="app-shell" id="app-shell">
  <main class="main-content">

    <div class="kpi-grid" id="income-kpi-grid" style="grid-template-columns: repeat(auto-fill, minmax(180px,1fr));"></div>

    <div class="chart-card" style="margin-bottom:18px;">
      <div class="section-head"><h2>Income Trend (Last 14 Days)</h2></div>
      <div class="chart-wrap"><canvas id="incomeChart"></canvas></div>
    </div>

    <div class="section-head">
      <div><h2>All Income</h2><div class="sub" id="income-count-sub"></div></div>
      <button class="btn btn-primary" id="add-income-btn"><i class="fa-solid fa-plus"></i> Add Income</button>
    </div>
    <div class="filter-bar">
      <div class="input-icon-wrap filter-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="income-search" placeholder="Search notes / invoice...">
      </div>
      <select id="income-source-filter">
        <option value="">All Sources</option>
        <option value="sales">Sales Income</option>
        <option value="other">Other Income</option>
        <option value="manual">Manual Income</option>
      </select>
      <input type="date" id="income-date-filter">
    </div>
    <div class="table-wrap scrollx">
      <table class="data-table">
        <thead><tr><th>Date</th><th>Source</th><th>Category / Ref</th><th>Amount</th><th>Notes</th><th></th></tr></thead>
        <tbody id="income-tbody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/income.js"></script>
</body>
</html>
