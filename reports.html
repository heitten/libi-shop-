<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Reports — Textile Shop Manager</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div class="app-shell" id="app-shell">
  <main class="main-content">

    <div class="card mb-10">
      <div class="filter-bar" style="margin-bottom:0;">
        <select id="report-type">
          <option value="sales">Sales Report</option>
          <option value="purchases">Purchase Report</option>
          <option value="expenses">Expense Report</option>
          <option value="income">Income Report</option>
          <option value="profit">Profit Report</option>
          <option value="inventory">Inventory Report</option>
          <option value="customers">Customer Report</option>
          <option value="suppliers">Supplier Report</option>
        </select>
        <select id="report-period">
          <option value="today">Daily (Today)</option>
          <option value="week">Weekly (This Week)</option>
          <option value="month" selected>Monthly (This Month)</option>
          <option value="year">Yearly (This Year)</option>
          <option value="custom">Custom Range</option>
        </select>
        <input type="date" id="report-from" class="hidden">
        <input type="date" id="report-to" class="hidden">
        <div style="flex:1;"></div>
        <button class="btn btn-ghost" id="print-report-btn"><i class="fa-solid fa-print"></i> Print</button>
        <button class="btn btn-ghost" id="csv-report-btn"><i class="fa-solid fa-file-csv"></i> CSV</button>
        <button class="btn btn-ghost" id="excel-report-btn"><i class="fa-solid fa-file-excel"></i> Excel</button>
        <button class="btn btn-primary" id="pdf-report-btn"><i class="fa-solid fa-file-pdf"></i> PDF</button>
      </div>
    </div>

    <div class="kpi-grid" id="report-kpi-grid" style="grid-template-columns: repeat(auto-fill, minmax(180px,1fr));"></div>

    <div class="chart-card" style="margin-bottom:18px;">
      <div class="section-head"><h2 id="chart-title">Trend</h2></div>
      <div class="chart-wrap"><canvas id="reportChart"></canvas></div>
    </div>

    <div id="report-print-area">
      <div class="section-head"><h2 id="table-title">Details</h2><div class="sub" id="report-count-sub"></div></div>
      <div class="table-wrap scrollx">
        <table class="data-table" id="report-table">
          <thead id="report-thead"></thead>
          <tbody id="report-tbody"></tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
