<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Products — Textile Shop Manager</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/mobile.css">
<style>
  .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .catalog-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; position: relative; }
  .catalog-card .cc-img { height: 150px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 30px; overflow: hidden; }
  .catalog-card .cc-img img { width: 100%; height: 100%; object-fit: cover; }
  .catalog-card .cc-body { padding: 12px; }
  .catalog-card .cc-cat { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; }
  .catalog-card .cc-name { font-size: 13.5px; font-weight: 700; margin: 3px 0 6px; line-height: 1.3; min-height: 34px; }
  .catalog-card .cc-price { display: flex; align-items: baseline; gap: 6px; }
  .catalog-card .cc-price .now { font-weight: 800; font-size: 15px; color: var(--primary); }
  .catalog-card .cc-price .old { font-size: 12px; color: var(--text-muted); text-decoration: line-through; }
  .catalog-card .cc-fav { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.9); border: none; color: var(--text-muted); font-size: 14px; }
  .catalog-card .cc-fav.active { color: var(--danger); }
  .catalog-card .cc-actions { display: flex; gap: 6px; margin-top: 10px; }
  .catalog-list-row { display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; align-items: center; }
  .catalog-list-row .cl-img { width: 64px; height: 64px; border-radius: 10px; background: var(--surface-2); flex-shrink: 0; overflow: hidden; display:flex; align-items:center; justify-content:center; color: var(--text-muted); }
  .catalog-list-row .cl-img img { width: 100%; height: 100%; object-fit: cover; }
  .view-toggle { display: flex; gap: 4px; background: var(--surface-2); border-radius: var(--radius-sm); padding: 4px; }
  .view-toggle button { width: 34px; height: 34px; border-radius: 6px; border: none; background: transparent; color: var(--text-muted); }
  .view-toggle button.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow); }
  .barcode-preview canvas { width: 100%; height: 70px; }
  .qr-preview canvas { width: 130px; height: 130px; image-rendering: pixelated; }
</style>
</head>
<body>
<div class="app-shell" id="app-shell">
  <main class="main-content">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="manage"><i class="fa-solid fa-list"></i> Manage Products</button>
      <button class="tab-btn" data-tab="catalog"><i class="fa-solid fa-store"></i> Customer Catalog</button>
    </div>

    <div id="manage-panel">
      <div class="section-head">
        <div>
          <h2>All Products</h2>
          <div class="sub" id="product-count-sub"></div>
        </div>
        <button class="btn btn-primary" id="add-product-btn"><i class="fa-solid fa-plus"></i> Add Product</button>
      </div>
      <div class="filter-bar">
        <div class="input-icon-wrap filter-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="search-input" placeholder="Search by name, SKU, barcode...">
        </div>
        <select id="filter-category"><option value="">All Categories</option></select>
        <select id="filter-stock">
          <option value="">All Stock Status</option>
          <option value="in">In Stock</option>
          <option value="low">Low Stock</option>
          <option value="out">Out of Stock</option>
        </select>
        <select id="sort-by">
          <option value="name">Sort: Name</option>
          <option value="stock">Sort: Stock</option>
          <option value="price">Sort: Price</option>
          <option value="newest">Sort: Newest</option>
        </select>
      </div>
      <div class="table-wrap scrollx">
        <table class="data-table" id="products-table">
          <thead>
            <tr>
              <th>Product</th><th>Category</th><th>Purchase</th><th>Selling</th><th>Stock</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="products-tbody"></tbody>
        </table>
      </div>
    </div>

    <div id="catalog-panel" class="hidden">
      <div class="section-head">
        <div>
          <h2>Customer Catalog</h2>
          <div class="sub">Browse products the way your customers see them</div>
        </div>
        <div class="view-toggle">
          <button class="active" data-view="grid"><i class="fa-solid fa-grip"></i></button>
          <button data-view="list"><i class="fa-solid fa-list"></i></button>
        </div>
      </div>
      <div class="filter-bar">
        <div class="input-icon-wrap filter-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="catalog-search" placeholder="Search products...">
        </div>
        <select id="catalog-category"><option value="">All Categories</option></select>
        <label class="checkbox-row" style="margin:0;"><input type="checkbox" id="fav-only"> <span>Favorites only</span></label>
      </div>
      <div id="catalog-container"></div>
    </div>
  </main>
</div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/products.js"></script>
</body>
</html>
