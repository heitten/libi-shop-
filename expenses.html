<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Expenses — Textile Shop Manager</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div class="app-shell" id="app-shell">
  <main class="main-content">

    <div class="kpi-grid" id="expense-kpi-grid" style="grid-template-columns: repeat(auto-fill, minmax(180px,1fr));"></div>

    <div class="dash-grid">
      <div class="chart-card small" style="grid-column: 1 / -1; max-width:420px;">
        <div class="section-head"><h2>Expenses by Category</h2></div>
        <div class="chart-wrap"><canvas id="expenseChart"></canvas></div>
      </div>
    </div>

    <div class="section-head">
      <div><h2>All Expenses</h2><div class="sub" id="expense-count-sub"></div></div>
      <button class="btn btn-primary" id="add-expense-btn"><i class="fa-solid fa-plus"></i> Add Expense</button>
    </div>
    <div class="filter-bar">
      <div class="input-icon-wrap filter-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="expense-search" placeholder="Search notes...">
      </div>
      <select id="expense-category-filter"><option value="">All Categories</option></select>
      <input type="date" id="expense-date-filter">
    </div>
    <div class="table-wrap scrollx">
      <table class="data-table">
        <thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Payment</th><th>Notes</th><th></th></tr></thead>
        <tbody id="expenses-tbody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/expenses.js"></script>
</body>
</html>
