<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Dashboard — Textile Shop Manager</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div class="app-shell" id="app-shell">
  <main class="main-content">

    <div class="kpi-grid" id="kpi-grid"></div>

    <div class="dash-grid">
      <div class="dash-col">
        <div class="chart-card">
          <div class="section-head">
            <h2>Sales Overview (Last 14 Days)</h2>
          </div>
          <div class="chart-wrap"><canvas id="salesChart"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="section-head">
            <h2>Latest Sales</h2>
            <a href="sales.html" class="btn btn-ghost btn-sm">View All</a>
          </div>
          <div id="latest-sales-list"></div>
        </div>
      </div>
      <div class="dash-col">
        <div class="chart-card small">
          <div class="section-head"><h2>Sales by Category</h2></div>
          <div class="chart-wrap"><canvas id="categoryChart"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="section-head"><h2>Best Selling Products</h2></div>
          <div id="best-sellers-list"></div>
        </div>
      </div>
    </div>

    <div class="dash-grid">
      <div class="chart-card">
        <div class="section-head">
          <h2>Latest Expenses</h2>
          <a href="expenses.html" class="btn btn-ghost btn-sm">View All</a>
        </div>
        <div id="latest-expenses-list"></div>
      </div>
      <div class="chart-card">
        <div class="section-head"><h2>Recent Activity</h2></div>
        <div class="activity-feed" id="activity-feed"></div>
      </div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
