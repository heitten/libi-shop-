<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Textile Shop Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧵</text></svg>">
<style>
  html,body{margin:0;height:100%;background:#6C5CE7;display:flex;align-items:center;justify-content:center;font-family:sans-serif;}
  .loader{color:#fff;text-align:center;}
  .spin{width:40px;height:40px;border:3.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 14px;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <div class="loader"><div class="spin"></div>Loading Textile Shop Manager...</div>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    Storage.seedIfEmpty();
    const session = Storage.getSession();
    window.location.replace(session ? "dashboard.html" : "login.html");
  </script>
</body>
</html>
